name: Build MIPS

on:
  workflow_dispatch:

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Install deps
          run: sudo apt-get update && sudo apt-get install -y build-essential libncurses5-dev gawk git libssl-dev gettext zlib1g-dev swig unzip python3 python3-distutils rsync
          
        - name: Download SDK
          run: | 
            wget -q https://downloads.openwrt.org/releases/23.05.3/targets/ramips/mt7621/openwrt-sdk-23.05.3-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz -O sdk.tar.xz
            tar xf sdk.tar.xz
            mv openwrt-sdk-* openwrt-sdk

        - name: Build
          run: |
            cd openwrt-sdk
            ./scripts/feeds update -a
            ./scripts/feeds install -a
            mkdir -p package/xunlei-kuainiao
            cp -r $GITHUB_WORKSPACE/xunlei-kuainiao-service/* package/xunlei-kuainiao/
            cp -r $GITHUB_WORKSPACE/luci-app-xunleikuainiao package/
            echo CONFIG_TARGET_ramips=y > .config
            echo CONFIG_TARGET_ramips_mt7621=y >> .config
            echo CONFIG_PACKAGE_xunlei-kuainiao-service=y >> .config
            echo CONFIG_PACKAGE_luci-app-xunleikuainiao=y >> .config
            make defconfig
            make package/xunlei-kuainiao-service/compile V=s
            make package/luci-app-xunleikuainiao/compile V=s

        - name: Upload
          uses: actions/upload-artifact@v4
          with:
            name: xunlei-kuainiao-mips
            path: openwrt-sdk/bin/packages/**/*.ipk
